version: '3.8'

# ==============================================================================
# Docker Compose Orchestration for Chief Secretariat NWP Portal
# Services:
#   - web: PHP 8.2 + Apache web application
#   - db:  MySQL 8.0 database engine with healthchecks
# ==============================================================================

services:
  # Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csweb_app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-csweb_db}
      - DB_USER=${DB_USER:-csweb_user}
      - DB_PASS=${DB_PASS:-csweb_pass_2026}
      - APP_ENV=${APP_ENV:-production}
    volumes:
      # Persistent volume for uploaded official directives, PDFs, and circulars
      - csweb_uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - csweb_network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: csweb_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secure_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-csweb_db}
      MYSQL_USER: ${DB_USER:-csweb_user}
      MYSQL_PASSWORD: ${DB_PASS:-csweb_pass_2026}
    volumes:
      # Persistent volume for MySQL database tables & data
      - csweb_db_data:/var/lib/mysql
    networks:
      - csweb_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-root_secure_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  csweb_db_data:
    name: csweb_db_data
  csweb_uploads:
    name: csweb_uploads

networks:
  csweb_network:
    name: csweb_network

